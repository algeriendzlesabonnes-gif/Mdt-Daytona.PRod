<!DOCTYPE html>
<html lang="fr" x-data="daytonaOS()">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAYTONA RP | MDT v5.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body x-init="initOS()">
    <div class="scanline"></div>

    <template x-if="!session.authenticated">
        <div class="login-container">
            <div class="login-card glass">
                <img src="https://i.imgur.com/kHLTz7R.png" class="logo-anim">
                <h1 class="font-big text-5xl italic uppercase tracking-tighter mt-4">Daytona <span class="text-blue-500">MDT</span></h1>
                <div class="mt-8 space-y-3">
                    <div class="relative">
                        <i class="fas fa-id-card absolute left-4 top-4 text-blue-500"></i>
                        <input x-model="loginForm.badge" type="text" placeholder="MATRICULE" class="input-modern">
                    </div>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-4 top-4 text-blue-500"></i>
                        <input x-model="loginForm.pass" type="password" placeholder="MOT DE PASSE" class="input-modern">
                    </div>
                    <button @click="attemptLogin()" class="btn-login">INITIALISER LA CONNEXION</button>
                </div>
                <p class="text-[8px] text-red-500 font-bold tracking-[0.3em] mt-6 uppercase">Accès restreint au personnel autorisé</p>
            </div>
        </div>
    </template>

    <div x-show="session.authenticated" class="app-layout" x-cloak>
        
        <aside class="sidebar glass">
            <div class="sidebar-top">
                <img src="https://i.imgur.com/FwV5s7U.png" class="badge-side">
                <div class="text-center mt-2">
                    <p class="text-[10px] text-blue-500 font-black uppercase tracking-widest" x-text="user.rank"></p>
                    <p class="text-xl font-black italic uppercase" x-text="user.name"></p>
                </div>
            </div>

            <nav class="nav-menu">
                <p class="nav-label">OPÉRATIONS</p>
                <button @click="page = 'dash'" :class="page === 'dash' && 'active'"><i class="fas fa-th-large"></i> DASHBOARD</button>
                <button @click="page = 'citizens'" :class="page === 'citizens' && 'active'"><i class="fas fa-user-friends"></i> CITOYENS</button>
                <button @click="page = 'vehicles'" :class="page === 'vehicles' && 'active'"><i class="fas fa-car-side"></i> VÉHICULES</button>
                
                <p class="nav-label">SYSTÈME</p>
                <button x-show="user.isAdmin" @click="page = 'admin'" :class="page === 'admin' && 'active'"><i class="fas fa-cog"></i> STAFF PANEL</button>
            </nav>

            <div class="sidebar-footer">
                <img src="https://i.imgur.com/Nh4aJbG.png" class="la-logo">
                <button @click="logout()" class="btn-quit">DÉCONNEXION</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header glass">
                <div class="flex items-center gap-6">
                    <div class="status-pill"><span class="pulse"></span> LIGNE SÉCURISÉE</div>
                    <div class="text-[10px] font-bold text-slate-500 uppercase">Unit: <span class="text-white" x-text="user.badge"></span></div>
                </div>
                <div class="clock-display" x-text="currentTime"></div>
            </header>

            <div class="content-body glass">
                
                <div x-show="page === 'dash'" class="fade-in">
                    <div class="hero-banner">
                        <img src="https://i.imgur.com/kHLTz7R.png" class="hero-bg">
                        <h2 class="text-6xl font-big italic uppercase">Daytona <span class="text-blue-500">MDT</span></h2>
                        <p class="text-lg opacity-80 uppercase tracking-widest font-light">Terminal de Données Mobile v5.2</p>
                    </div>

                    <div class="grid grid-cols-3 gap-6 mt-10">
                        <div class="stat-card">
                            <i class="fas fa-file-invoice-dollar text-red-500 text-3xl mb-2"></i>
                            <div class="text-4xl font-black" x-text="stats.warrants"></div>
                            <div class="text-[10px] font-bold text-slate-500 uppercase">Mandats Actifs</div>
                        </div>
                        <div class="stat-card">
                            <i class="fas fa-shield-alt text-blue-500 text-3xl mb-2"></i>
                            <div class="text-4xl font-black">12</div>
                            <div class="text-[10px] font-bold text-slate-500 uppercase">Agents en Service</div>
                        </div>
                        <div class="stat-card">
                            <i class="fas fa-database text-amber-500 text-3xl mb-2"></i>
                            <div class="text-4xl font-black" x-text="citizens.length"></div>
                            <div class="text-[10px] font-bold text-slate-500 uppercase">Dossiers Archivés</div>
                        </div>
                    </div>
                </div>

                <div x-show="page === 'citizens'" class="fade-in">
                    <div class="flex justify-between items-center mb-8">
                        <h2 class="text-4xl font-big italic uppercase tracking-tighter">Fichier <span class="text-blue-500">National</span></h2>
                        <button @click="modals.addCitizen = true" class="btn-plus">+ NOUVEAU DOSSIER</button>
                    </div>

                    <div class="search-box mb-6">
                        <i class="fas fa-search"></i>
                        <input x-model="search.citizen" type="text" placeholder="RECHERCHE PAR NOM OU TÉLÉPHONE...">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <template x-for="c in filteredCitizens" :key="c.id">
                            <div class="data-row glass">
                                <div class="flex justify-between items-center">
                                    <div>
                                        <p class="text-xl font-black italic uppercase" x-text="c.firstname + ' ' + c.lastname"></p>
                                        <p class="text-[10px] text-slate-500 font-bold" x-text="'Tél: ' + c.phone"></p>
                                    </div>
                                    <div class="flex items-center gap-3">
                                        <span :class="c.wanted ? 'badge-red' : 'badge-green'" x-text="c.wanted ? 'RECHERCHÉ' : 'EN RÈGLE'"></span>
                                        <button @click="deleteCitizen(c.id)" class="text-red-500 hover:text-white transition-colors"><i class="fas fa-trash-alt"></i></button>
                                    </div>
                                </div>
                                <div class="mt-4 flex gap-2">
                                    <button @click="toggleWarrant(c.id)" class="btn-action-small">CHANGER STATUT</button>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <div x-show="page === 'admin'" class="fade-in">
                    <h2 class="text-4xl font-big italic uppercase mb-8">Management <span class="text-amber-500">Interne</span></h2>
                    <div class="glass p-8 rounded-3xl max-w-lg">
                        <h3 class="text-xs font-black text-slate-500 uppercase mb-4 italic">Enrôler un nouvel agent</h3>
                        <div class="space-y-4">
                            <input x-model="newStaff.name" type="text" placeholder="NOM COMPLET" class="input-modern">
                            <input x-model="newStaff.badge" type="text" placeholder="BADGE" class="input-modern">
                            <input x-model="newStaff.pass" type="text" placeholder="PASSWORD" class="input-modern">
                            <button @click="addStaff()" class="btn-login !bg-amber-600">VALIDER L'ENRÔLEMENT</button>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <div x-show="modals.addCitizen" class="modal-bg" x-cloak>
        <div class="modal-box glass">
            <h3 class="text-2xl font-black italic uppercase mb-6">Ajouter aux <span class="text-blue-500">Archives</span></h3>
            <div class="grid grid-cols-2 gap-4">
                <input x-model="newCitizen.firstname" type="text" placeholder="Prénom" class="input-modern">
                <input x-model="newCitizen.lastname" type="text" placeholder="Nom" class="input-modern">
                <input x-model="newCitizen.birth" type="text" placeholder="Date de Naissance" class="input-modern">
                <input x-model="newCitizen.phone" type="text" placeholder="Numéro de Téléphone" class="input-modern">
            </div>
            <div class="mt-8 flex gap-4">
                <button @click="saveCitizen()" class="btn-login flex-1">ENREGISTRER</button>
                <button @click="modals.addCitizen = false" class="btn-login !bg-slate-700 flex-1">ANNULER</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="admin.js"></script>
</body>
</html>
