<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MDT LAPD - Daytona RP</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="tablet-container">
        <aside class="sidebar">
            <div class="brand">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e0/Seal_of_the_Los_Angeles_Police_Department.svg" alt="LAPD">
                <h2 class="orbitron">MDT v4.2</h2>
            </div>
            
            <div class="user-profile">
                <img id="user-avatar" src="https://via.placeholder.com/50" alt="Avatar">
                <div class="user-info">
                    <p id="user-name">Non connecté</p>
                    <span id="user-rank" class="rank-badge">Visiteur</span>
                </div>
            </div>

            <nav class="nav-menu">
                <button class="btn-nav active" onclick="showTab('dashboard')"><i class="fas fa-th-large"></i> Dashboard</button>
                <button class="btn-nav" onclick="showTab('citizens')"><i class="fas fa-users"></i> Citoyens</button>
                <button class="btn-nav" onclick="showTab('reports')"><i class="fas fa-file-signature"></i> Rapports</button>
                <button class="btn-nav" onclick="showTab('evidence')"><i class="fas fa-camera"></i> Preuves</button>
                <button id="admin-btn" class="btn-nav admin-only" onclick="showTab('admin')" style="display:none;"><i class="fas fa-user-shield"></i> Staff Panel</button>
            </nav>

            <button class="btn-logout" onclick="logout()"><i class="fas fa-power-off"></i> Déconnexion</button>
        </aside>

        <main class="content">
            <header class="top-header">
                <div class="status">
                    <span class="pulse"></span> SYSTÈME OPÉRATIONNEL - <span id="clock">00:00:00</span>
                </div>
                <div class="discord-auth" id="login-section">
                    <button onclick="loginDiscord()" class="btn-discord"><i class="fab fa-discord"></i> Connexion</button>
                </div>
            </header>

            <section id="tab-dashboard" class="tab-content">
                <h1 class="orbitron">Tableau de Bord</h1>
                <div class="stats-grid">
                    <div class="stat-card blue"><h3>Unités</h3><p>08</p></div>
                    <div class="stat-card red"><h3>Mandats</h3><p>03</p></div>
                    <div class="stat-card green"><h3>Interventions</h3><p>12</p></div>
                </div>
                <div class="recent-activity">
                    <h3>Activités Récentes</h3>
                    <ul id="log-list">
                        <li>Chargement des logs...</li>
                    </ul>
                </div>
            </section>

            <section id="tab-citizens" class="tab-content" style="display:none;">
                <h1 class="orbitron">Recherche Citoyen</h1>
                <div class="search-bar">
                    <input type="text" id="citizen-search-input" placeholder="Nom ou Prénom...">
                    <button onclick="searchCitizen()"><i class="fas fa-search"></i></button>
                </div>
                <div id="citizen-results" class="results-grid"></div>
            </section>

            <section id="tab-admin" class="tab-content" style="display:none;">
                <h1 class="orbitron text-danger">Panel Administration</h1>
                <div id="admin-content">
                    </div>
            </section>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    
    <script src="script.js"></script>
    <script src="admin.js"></script>
</body>
</html>
